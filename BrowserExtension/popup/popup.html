<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>
    <span class="header-title">PDownloader</span>
    <span class="header-badge" id="badgeCount">0</span>
  </div>

  <!-- Status -->
  <div class="status-card err" id="statusCard">
    <span class="status-dot"></span>
    <span class="status-text" id="statusText" data-i18n="popupStatusChecking">Đang kiểm tra...</span>
  </div>

  <!-- Stats -->
  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-val" id="interceptCount">0</div>
      <div class="stat-lbl" data-i18n="popupSessionLabel">Phiên này</div>
    </div>
  </div>


  <!-- Detected media -->
  <div class="section-hd" data-i18n="popupSectionDetectedMedia">Detected media</div>
  <div class="media-list" id="mediaList">
    <div class="media-empty" data-i18n="popupDetectedMediaEmpty">No media detected on this page</div>
  </div>

  <!-- Settings -->
  <div class="section-hd" data-i18n="popupSectionInterceptSettings">Cài đặt bắt link</div>

  <div class="toggle-row">
    <div>
      <div class="toggle-lbl" data-i18n="popupToggleAutoIntercept">Tự động bắt link</div>
      <div class="toggle-sub" data-i18n="popupToggleAutoInterceptSub">Chặn tải của trình duyệt, chuyển sang PDownloader</div>
    </div>
    <label class="sw">
      <input type="checkbox" id="autoIntercept" checked/>
      <span class="sw-track"></span>
    </label>
  </div>

  <div class="toggle-row" id="autoInterceptSiteRow">
    <div>
      <div class="toggle-lbl" data-i18n="popupToggleAutoInterceptSite">Tự động bắt link ở trang web này</div>
      <div class="toggle-sub" id="autoInterceptSiteSub" data-i18n="popupToggleAutoInterceptSiteSubDefault">Áp dụng riêng cho trang bạn đang mở</div>
    </div>
    <label class="sw">
      <input type="checkbox" id="autoInterceptSite" checked/>
      <span class="sw-track"></span>
    </label>
  </div>

  <div class="toggle-row">
    <div>
      <div class="toggle-lbl" data-i18n="popupToggleShowNotif">Hiện thông báo</div>
      <div class="toggle-sub" data-i18n="popupToggleShowNotifSub">Thông báo khi bắt được link</div>
    </div>
    <label class="sw">
      <input type="checkbox" id="showNotifications" checked/>
      <span class="sw-track"></span>
    </label>
  </div>

  <!-- Blacklist -->
  <div class="section-hd" data-i18n="popupSectionBlacklist">Trang bị chặn</div>
  <div class="bl-list" id="blList"></div>

  <script src="../common/browserApi.js"></script>
  <script src="../common/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>

name: Auto publish release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-version-update')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # Authenticate the later push with the release App, not GITHUB_TOKEN.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Get version from release-drafter (do not publish) ──────────────────
      - name: Draft release (get version only)
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release info
        shell: bash
        run: |
          VERSION="${{ steps.drafter.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BODY<<EOF" >> "$GITHUB_ENV"
          echo "${{ steps.drafter.outputs.body }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # ── Update version in all .csproj files ───────────────────────────
      - name: Update AssemblyVersion in all .csproj files
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          $version4 = "$version.0"

          $csprojFiles = Get-ChildItem -Path ".\src" -Recurse -Filter "*.csproj" | Where-Object {
            $_.FullName -notmatch "\\obj\\" -and $_.FullName -notmatch "\\bin\\"
          }

          foreach ($file in $csprojFiles) {
            $content = Get-Content $file.FullName -Raw

            $content = $content -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$version4</AssemblyVersion>"
            $content = $content -replace '<FileVersion>[^<]*</FileVersion>',         "<FileVersion>$version4</FileVersion>"
            $content = $content -replace '<Version>[^<]*</Version>',                 "<Version>$version</Version>"

            Set-Content $file.FullName $content -NoNewline
            Write-Host "Updated $($file.Name) → $version4"
          }

      # ── Update CHANGELOG.md ────────────────────────────────────────────
      - name: Update CHANGELOG.md
        shell: bash
        run: |
          {
            echo "## v$VERSION"
            echo
            echo "$BODY"
            echo
            echo "---"
            echo
            cat CHANGELOG.md 2>/dev/null || true
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # ── Build native installers for Windows x64 and Windows ARM64 ────────
      - name: Build x64 and ARM64 installers
        shell: pwsh
        run: |
          # Redirect stdin because build.bat pauses when run interactively.
          & cmd.exe /d /c "call build.bat all < nul"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify installers
        shell: pwsh
        run: |
          $x64Installer = "installer-output\PDownloader.Installer-win-x64.exe"
          $versionedX64Installer = "installer-output\PDownloader.Installer-v$env:VERSION.exe"

          Copy-Item -LiteralPath $x64Installer -Destination $versionedX64Installer -Force

          $installers = @(
            $versionedX64Installer,
            $x64Installer,
            "installer-output\PDownloader.Installer-win-arm64.exe"
          )

          foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              Write-Error "Installer was not created: $installer"
              exit 1
            }

            $size = (Get-Item -LiteralPath $installer).Length
            Write-Host "$installer size: $([math]::Round($size / 1MB, 2)) MB"
            if ($size -lt 1MB) {
              Write-Error "Installer is too small ($size bytes): $installer"
              exit 1
            }
          }

          $x64Hash = (Get-FileHash -LiteralPath $x64Installer).Hash
          $versionedX64Hash = (Get-FileHash -LiteralPath $versionedX64Installer).Hash
          if ($x64Hash -ne $versionedX64Hash) {
            Write-Error "Versioned x64 installer does not match the native x64 installer."
            exit 1
          }

      # ── Commit version bump + CHANGELOG ─────────────────────────────────
      # Mint after the installer build: App installation tokens expire after one hour.
      # Install this App on the repository and grant it ruleset bypass (Always allow).
      - name: Create release App token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit version bump
        shell: bash
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_BOT_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
        run: |
          gh auth setup-git --hostname github.com
          bot_user_id="$(gh api "/users/${RELEASE_BOT_SLUG}[bot]" --jq .id)"
          git config user.name "${RELEASE_BOT_SLUG}[bot]"
          git config user.email "${bot_user_id}+${RELEASE_BOT_SLUG}[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          git add src

          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "chore(release): v$VERSION"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi

      # ── Publish release with installer ──────────────────────────────
      - name: Publish release with installer
        uses: release-drafter/release-drafter@v6
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This versioned x64 alias sorts before the architecture-specific assets.
      # Older updaters that select the first PDownloader.Installer*.exe will
      # therefore still receive a compatible x64 installer.
      - name: Upload versioned x64 compatibility installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.drafter.outputs.tag_name }}
          files: installer-output/PDownloader.Installer-v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload x64 installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.drafter.outputs.tag_name }}
          files: installer-output/PDownloader.Installer-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ARM64 installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.drafter.outputs.tag_name }}
          files: installer-output/PDownloader.Installer-win-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

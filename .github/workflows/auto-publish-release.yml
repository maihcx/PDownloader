name: Auto publish release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-version-update')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── Lấy version từ release-drafter (không publish) ──────────────────
      - name: Draft release (get version only)
        id: drafter
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release info
        shell: bash
        run: |
          VERSION="${{ steps.drafter.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BODY<<EOF" >> "$GITHUB_ENV"
          echo "${{ steps.drafter.outputs.body }}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      # ── Cập nhật version trong tất cả .csproj ───────────────────────────
      - name: Update AssemblyVersion in all .csproj files
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          # AssemblyVersion cần 4 phần (x.y.z.0), FileVersion và Version dùng 3 phần
          $version4 = "$version.0"

          $csprojFiles = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object {
            $_.FullName -notmatch "\\obj\\" -and $_.FullName -notmatch "\\bin\\"
          }

          foreach ($file in $csprojFiles) {
            $content = Get-Content $file.FullName -Raw

            $content = $content -replace '<AssemblyVersion>[^<]*</AssemblyVersion>', "<AssemblyVersion>$version4</AssemblyVersion>"
            $content = $content -replace '<FileVersion>[^<]*</FileVersion>',         "<FileVersion>$version4</FileVersion>"
            $content = $content -replace '<Version>[^<]*</Version>',                 "<Version>$version</Version>"

            Set-Content $file.FullName $content -NoNewline
            Write-Host "Updated $($file.Name) → $version4"
          }

      # ── Cập nhật CHANGELOG.md ────────────────────────────────────────────
      - name: Update CHANGELOG.md
        shell: bash
        run: |
          {
            echo "## v$VERSION"
            echo
            echo "$BODY"
            echo
            echo "---"
            echo
            cat CHANGELOG.md 2>/dev/null || true
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # ── Build native installers for Windows x64 and Windows ARM64 ────────
      - name: Build x64 and ARM64 installers
        shell: pwsh
        run: |
          # Redirect stdin because build.bat pauses when run interactively.
          & cmd.exe /d /c "call build.bat all < nul"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify installers and create legacy x64 alias
        shell: pwsh
        run: |
          $installers = @(
            "installer-output\PDownloader.Installer-win-x64.exe",
            "installer-output\PDownloader.Installer-win-arm64.exe"
          )

          foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              Write-Error "Installer was not created: $installer"
              exit 1
            }

            $size = (Get-Item -LiteralPath $installer).Length
            Write-Host "$installer size: $([math]::Round($size / 1MB, 2)) MB"
            if ($size -lt 1MB) {
              Write-Error "Installer is too small ($size bytes): $installer"
              exit 1
            }
          }

          # Keep the old asset name for x64 clients that do not know the
          # architecture-specific release filenames yet.
          Copy-Item -LiteralPath "installer-output\PDownloader.Installer-win-x64.exe" -Destination "installer-output\PDownloader.Installer.exe" -Force

      # ── Commit version bump + CHANGELOG ─────────────────────────────────
      - name: Commit version bump
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add CHANGELOG.md
          git add "**/*.csproj"
          git commit -m "chore(release): v$VERSION" || exit 0
          git push origin HEAD:${{ github.event.repository.default_branch }}

      # ── Publish release kèm file installer ──────────────────────────────
      - name: Publish release with installer
        uses: release-drafter/release-drafter@v6
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.drafter.outputs.tag_name }}
          files: |
            installer-output/PDownloader.Installer.exe
            installer-output/PDownloader.Installer-win-x64.exe
            installer-output/PDownloader.Installer-win-arm64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
